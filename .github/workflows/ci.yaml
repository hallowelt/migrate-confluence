name: basic-tests

on: push

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Read pandoc version from Dockerfile
        run: echo "PANDOC_VERSION=$(grep -oP 'pandoc/minimal:\K[0-9.]+' Dockerfile)" >> "$GITHUB_ENV"

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.5
          tools: composer:2

      - name: Cache pandoc
        id: cache-pandoc
        uses: actions/cache@v4
        with:
          path: ~/pandoc
          key: pandoc-${{ env.PANDOC_VERSION }}

      - name: Install pandoc
        if: steps.cache-pandoc.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/pandoc/bin
          id=$(docker create pandoc/minimal:$PANDOC_VERSION)
          docker cp "$id:/usr/local/bin/pandoc" ~/pandoc/bin/pandoc
          docker rm "$id"

      - name: Add pandoc to PATH
        run: echo "$HOME/pandoc/bin" >> $GITHUB_PATH

      - name: Get composer cache dir
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Install dependencies
        run: composer update

      - name: Run check coding conventions
        run: composer test

      - name: Run unit tests
        run: composer unittest
